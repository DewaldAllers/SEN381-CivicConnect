name: CivicConnect Persistence Checks
permissions:
  contents: read

"on":
  pull_request:
    branches: [main, "liam/**"]
    paths: ["app/backend/**", ".github/workflows/persistence-checks.yml"]
  workflow_dispatch:

jobs:
  persistence-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: civicconnect_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: civicconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicconnect_test -d civicconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify against PostgreSQL
        run: npm run db:verify
        env:
          TEST_DATABASE_URL: postgresql://civicconnect_test:disposable_ci_password@localhost:5432/civicconnect_test
      - name: Verify authenticated API, repository contract and compiled server restart
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://civicconnect_test:disposable_ci_password@localhost:5432/civicconnect_test
      - name: Prepare restricted runtime login on disposable CI database
        run: |
          npm run db:migrate
          node --input-type=module -e "import pg from 'pg'; import fs from 'node:fs'; const pool = new pg.Pool({connectionString: process.env.DATABASE_URL}); try { await pool.query(\"CREATE ROLE civicconnect_runtime LOGIN NOINHERIT PASSWORD 'disposable_ci_runtime_password'\"); await pool.query(fs.readFileSync('operations/runtime-privileges.sql','utf8')); } finally { await pool.end(); }"
        env:
          DATABASE_URL: postgresql://civicconnect_test:disposable_ci_password@localhost:5432/civicconnect_test
      - name: Verify actual runtime privileges and rollback-only request lifecycle
        run: npm run db:verify:runtime
        env:
          DATABASE_URL: postgresql://civicconnect_runtime:disposable_ci_runtime_password@localhost:5432/civicconnect_test
