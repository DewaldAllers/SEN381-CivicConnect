name: CivicConnect Browser Journeys
permissions:
  contents: read

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The two journeys against the real server with requests kept in memory.
  journeys-in-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install the backend
        run: npm ci
        working-directory: app/backend
      - name: Install the journeys
        run: npm ci
        working-directory: app/e2e
      - name: Run the journeys
        run: npx playwright test
        working-directory: app/e2e
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-in-memory-report
          path: app/e2e/test-results/
          if-no-files-found: ignore

  # The same journeys with the server saving to PostgreSQL 18.
  journeys-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: civicconnect_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: civicconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicconnect_test -d civicconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://civicconnect_test:disposable_ci_password@localhost:5432/civicconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install the backend
        run: npm ci
        working-directory: app/backend
      - name: Install the journeys
        run: npm ci
        working-directory: app/e2e
      - name: Set up the database
        run: npm run db:migrate
        working-directory: app/backend
      - name: Run the journeys against PostgreSQL
        run: npx playwright test
        working-directory: app/e2e
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-postgres-report
          path: app/e2e/test-results/
          if-no-files-found: ignore
